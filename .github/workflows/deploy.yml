name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-pages-deploy.yml@v2
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '22'
      # Legacy peaceiris path (keeps CNAME docs.llazyemail.com behaviour).
      peaceiris-publish-dir: ./build
      peaceiris-cname: docs.llazyemail.com
    secrets: inherit
