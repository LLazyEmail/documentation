name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  deploy:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docusaurus-pages-deploy.yml@main
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '22'
      # Legacy peaceiris path (keeps CNAME docs.llazyemail.com behaviour).
      peaceiris-publish-dir: ./build
      peaceiris-cname: docs.llazyemail.com
    secrets: inherit
